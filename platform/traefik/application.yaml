apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik
  namespace: argocd
spec:
  project: default
  sources:
  - repoURL: https://traefik.github.io/charts
    targetRevision: 41.0.2
    chart: traefik
    helm:
      valueFiles:
      - $values/platform/traefik/values.yaml
  - repoURL: https://github.com/thomas-k8s-devops-lab/gitops.git
    targetRevision: main
    ref: values
  
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
  
  destination:
    server: https://kubernetes.default.svc
    namespace: traefik