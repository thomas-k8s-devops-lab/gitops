apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik
  namespace: argocd
spec:
  project: default
  sources:
    repoURL: https://github.com/traefik/traefik-helm-chart
    targetRevision: HEAD
    chart: traefik
    helm:
      valueFiles:
       - values.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: traefik